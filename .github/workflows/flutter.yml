name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # lib/firebase_options.dart is generated by the FlutterFire CLI and is
      # gitignored (it holds the project's API keys), so CI writes a stand-in.
      # It only has to compile: nothing here talks to Firebase.
      - name: Create Firebase options stub
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          /// CI stand-in for the generated, gitignored firebase_options.dart.
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
              apiKey: 'ci-dummy',
              appId: '1:000000000000:web:0000000000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-dummy',
            );
          }
          EOF

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=FREE_CURRENCY_API_KEY=ci-dummy
